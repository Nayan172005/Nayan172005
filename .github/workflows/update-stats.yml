name: Update GitHub Stats

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Nayan172005&show_icons=true&theme=great-gatsby
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Nayan172005&layout=compact&theme=great-gatsby&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Contribution Streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=Nayan172005&theme=dark&background=0D1117&border=30363D&stroke=30363D&ring=FF6C2C&fire=FF6C2C&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=FF6C2C&sideLabels=9F9F9F&dates=9F9F9F&disable_animations=true&timezone=Asia/Kolkata
          path: profile/streak.svg

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg
          if git diff --cached --quiet; then
            echo "Stats cards are already up to date."
            exit 0
          fi
          git commit -m "chore: update GitHub stats cards"
          git push
